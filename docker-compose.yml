services:
  db:
    image: mysql:8.0
    container_name: alba-mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/hybaezzar170-tech/alba-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alba-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  frontend:
    image: ghcr.io/hybaezzar170-tech/alba-frontend:latest
    container_name: alba-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
