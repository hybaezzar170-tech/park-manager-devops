services:
  db:
    image: mysql:8.0
    container_name: alba-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alba_docker
      MYSQL_ROOT_PASSWORD: alba_docker_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -palba_docker_root || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alba-backend
    restart: unless-stopped
    environment:
      APP_NAME: ALBA
      APP_ENV: local
      APP_KEY: "base64:YIznueEgL39tHsxcfUgfmfMhpqm1fgAFJ57qsIR3lSE="
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: alba_docker
      DB_USERNAME: root
      DB_PASSWORD: alba_docker_root
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alba-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql_data: