services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.test
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/hybaezzar170-tech/alba-backend:latest
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/hybaezzar170-tech/alba-frontend:latest
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  mysql_test_data:
