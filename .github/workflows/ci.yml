
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alba_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: alba_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, xml, ctype, json, tokenizer
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Contrôler le style du code (Pint)
        run: php vendor/bin/pint --test

      - name: Vérifier la conformité PSR-4
        run: composer dump-autoload --optimize --strict-psr

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Créer le schéma de test
        run: php artisan migrate --force

      - name: Exécuter les tests PHPUnit
        run: |
          mkdir -p reports
          php vendor/bin/phpunit --log-junit reports/junit.xml

      - name: Archiver le rapport PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report
          path: backend/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Vérifier que Laravel démarre
        run: php artisan --version

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyser le code (ESLint)
        run: npx eslint src --ext .js,.jsx

      - name: Construire le frontend
        run: npm run build
        env:
          CI: false

  package:
    name: Package artefacts
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Calculer l'identifiant de version
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ steps.meta.outputs.sha }}
          path: frontend/build
          retention-days: 14

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, xml, ctype, json, tokenizer
          coverage: none

      - name: Préparer le backend pour la production
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Archiver le backend
        run: tar --exclude='backend/tests' --exclude='backend/.env' -czf backend-${{ steps.meta.outputs.sha }}.tar.gz backend

      - uses: actions/upload-artifact@v4
        with:
          name: backend-package-${{ steps.meta.outputs.sha }}
          path: backend-${{ steps.meta.outputs.sha }}.tar.gz
          retention-days: 14
  docker:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: alba-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Construire l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: alba-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Vérifier le contenu de l'image backend
        run: |
          docker run --rm alba-backend:ci php artisan --version
          if docker run --rm alba-backend:ci test -f /var/www/html/.env; then
            echo "Un fichier .env est présent dans l'image" && exit 1
          fi